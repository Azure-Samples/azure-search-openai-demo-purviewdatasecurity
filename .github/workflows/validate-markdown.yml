name: Validate Markdown

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.ipynb'
      - '.github/workflows/validate-markdown.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.md'
      - '**.ipynb'
      - '.github/workflows/validate-markdown.yml'

permissions:
  contents: read

jobs:
  check-markdown:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Check Broken Relative Paths
            command: check_broken_paths
          - name: Check URLs Don't Have Locale
            command: check_urls_locale
          - name: Check Broken URLs
            command: check_broken_urls
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install markdown-checker
        run: python -m pip install --index-url https://packagefeedproxy.microsoft.io/pypi/simple/ markdown-checker==1.2.1
      - name: Check Markdown
        env:
          CHECK_COMMAND: ${{ matrix.command }}
        run: |
          markdown-checker --dir ./ --func "$CHECK_COMMAND" \
            --guide-url 'https://github.com/Azure-Samples/azure-search-openai-demo/blob/main/CONTRIBUTING.md' \
            --report-format markdown \
            --output-file-name "$RUNNER_TEMP/markdown-checker-report"
      - name: Publish check summary
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/markdown-checker-report.md" ]; then
            cat "$RUNNER_TEMP/markdown-checker-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
