name: Evaluate PR build

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  prepare:
    if: |
      github.event.issue.pull_request &&
      github.event.comment.body == '/evaluate' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.request.outputs.head_sha }}
      head_repo_name: ${{ steps.request.outputs.head_repo_name }}
    steps:
      - name: Record evaluation request
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number
            });
            if (pr.state !== 'open' || !pr.head.sha || !pr.head.repo) {
              throw new Error('PR is not open or has no available head');
            }
            const request = {
              run_id: context.runId,
              pr_number: context.issue.number,
              comment_id: context.payload.comment.id,
              head_sha: pr.head.sha,
              head_repo_id: pr.head.repo.id
            };
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'evaluation-request.json'), JSON.stringify(request));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_repo_name', pr.head.repo.full_name);

      # This file is produced before any PR code runs, on a separate runner.
      # The consumer still validates every field against the GitHub API.
      - name: Upload request metadata
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-request
          path: ${{ runner.temp }}/evaluation-request.json
          retention-days: 1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head without credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.head_repo_name }}
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build PR frontend without Azure access
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Check PR Python syntax without Azure access
        run: python -m compileall -q app/backend evals
